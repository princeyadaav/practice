<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#0f172a;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:400px;
            background:white;
            padding:30px;
            border-radius:12px;
            box-shadow:0 0 15px rgba(0,0,0,0.3);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
            color:#2563eb;
        }

        label{
            font-weight:bold;
        }

        input{
            width:100%;
            padding:10px;
            margin:8px 0 18px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:12px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:6px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

        .result{
            margin-top:20px;
            text-align:center;
        }

        #password{
            margin-top:10px;
            font-size:22px;
            color:green;
            word-break:break-all;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Password Generator</h2>

    <label>Letters</label>
    <input type="number" id="letters" min="1">

    <label>Special Symbols</label>
    <input type="number" id="symbols" min="0">

    <label>Numbers</label>
    <input type="number" id="numbers" min="0">

    <button onclick="generatePassword()">Generate Password</button>

    <div class="result">
        <h3>Your Password is</h3>
        <p id="password"></p>
    </div>

</div>

<script>

const letters = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
const numbers = "0123456789";
const symbols = "!@#$%&*()+_";

function randomChar(str){
    return str[Math.floor(Math.random()*str.length)];
}

function generatePassword(){

    let letterCount = parseInt(document.getElementById("letters").value);
    let symbolCount = parseInt(document.getElementById("symbols").value);
    let numberCount = parseInt(document.getElementById("numbers").value);

    let password = "";

    for(let i=0;i<letterCount;i++){
        password += randomChar(letters);
    }

    for(let i=0;i<symbolCount;i++){
        password += randomChar(symbols);
    }

    for(let i=0;i<numberCount;i++){
        password += randomChar(numbers);
    }

    document.getElementById("password").innerHTML = password;

}

</script>

</body>
</html>
